<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Visualizer - Welcome</title>
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
    <link rel="stylesheet" th:href="@{/assets/css/master.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: var(--background-color);
            transition: background-color 0.5s ease;
            animation: bodyFadeIn 0.8s ease forwards;
        }

        @keyframes bodyFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .landing-theme-toggle {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 100;
        }

        .landing-theme-toggle #theme-toggle {
            font-size: 1.8rem;
            color: var(--default-color);
            transition: transform 0.3s ease, color 0.3s ease;
            text-decoration: none;
            border: none;
            background: transparent;
        }

        .landing-theme-toggle #theme-toggle:hover {
            transform: scale(1.1);
            color: var(--accent-color);
        }


        body.dark-mode #theme-icon {
            color: #ffde00;
        }


        .circle-1, .circle-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
        }
        .circle-1 {
            width: 400px; height: 400px;
            background: var(--accent-color);
            top: -100px; left: -100px;
        }
        .circle-2 {
            width: 500px; height: 500px;
            background: #ffb3c6;
            bottom: -150px; right: -100px;
        }

        body.dark-mode .circle-2 { background: #880e4f; }

        .landing-container {
            text-align: center;
            z-index: 10;
            animation: contentDropIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .landing-title {
            font-size: 5rem;
            font-weight: 800;
            color: var(--heading-color);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .landing-title span {
            color: var(--accent-color);
        }

        .btn-enter {
            display: inline-block;
            padding: 16px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--contrast-color) !important;
            background-color: var(--accent-color);
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
            margin-top: 20px;
        }
        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.5);
        }

        @keyframes contentDropIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-out {
            animation: fadeOut 0.5s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; filter: blur(10px); }
        }
    </style>
</head>

<body id="landing-body">

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div class="header-social-links landing-theme-toggle">
    <button id="theme-toggle" class="btn btn-link p-0 me-2" type="button" aria-label="Toggle theme">
        <i id="theme-icon" class="bi bi-moon-fill"></i>
    </button>
</div>

<div class="circle-1"></div>
<div class="circle-2"></div>

<div class="landing-container">
    <h1 class="landing-title"><span>DSA</span> Visualizer</h1>
    <p style="color: var(--default-color); font-size: 1.3rem; margin-bottom: 40px;">Explore Data Structures & Algorithms interactively.</p>

    <a th:href="@{/dashboard}" class="btn-enter" id="enterBtn">Enter Dashboard</a>
</div>

<script th:src="@{/assets/js/master.js}"></script>

<script>
    document.getElementById('enterBtn').addEventListener('click', function(e) {
        e.preventDefault();
        const targetUrl = this.href;
        document.body.classList.add('fade-out');

        setTimeout(() => { window.location.href = targetUrl; }, 500);
    });
</script>
</body>
</html>
