<body xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/master}">
<div layout:fragment="content">
    <section class="section mt-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">

                    <div class="text-center mb-5">
                        <h2 class="mb-4">Array Visualization</h2>
                        <div class="ratio ratio-16x9 shadow rounded mx-auto" style="max-width: 800px;">
                            <video controls autoplay loop muted>
                                <source th:src="@{/assets/video/array.mp4}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h4 class="border-bottom pb-2">What is an Array?</h4>
                            <p>An array is a linear data structure that collects elements of the same data type and stores them in contiguous memory locations.</p>
                            <p><strong>Key Concept:</strong> Indices start at 0.</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</div>
</body>
